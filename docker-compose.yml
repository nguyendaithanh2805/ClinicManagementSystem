version: '3.8'

services:
  # 1. SQL Server Container
  mssql_server:
    build:
      context: .
      dockerfile: Server/MssqlDockerfile
    container_name: mssql_db
    environment:
      SA_PASSWORD: "Thanh12345@" 
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433" 
    volumes:
      - db_data:/var/opt/mssql
    restart: always
    healthcheck:
      test: [
        "CMD",
        "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost",
        "-U", "sa", "-P", "Thanh12345@",
        "-Q", "SELECT 1"
      ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  # 2. Backend API (.NET) Container
  backend_api:
    build:
      context: .
      dockerfile: Server/Api/Dockerfile 
    container_name: backend_api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    depends_on:
      mssql_server:
        condition: service_healthy
    restart: always

  # 3. AI App (Python/Flask) Container
  ai_service:
    build:
      context: .
      dockerfile: AI/Dockerfile
    container_name: ai_service
    env_file:
      - ./AI/.env
    restart: always

  # 4. Frontend Client (React/Nginx) Container
  frontend_client:
    build:
      context: .
      dockerfile: Client/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_IMAGE_URL: ${VITE_IMAGE_URL}
        VITE_API_URL_AI: ${VITE_API_URL_AI}
    container_name: frontend_client
    depends_on:
      - backend_api
      - ai_service
    restart: always

  # 5. Nginx Reverse Proxy Container
  nginx_proxy:
    image: nginx:latest
    container_name: nginx_proxy
    volumes:
      - ./nginx-proxy/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx-proxy/ssl/nginx.crt:/etc/ssl/certs/nginx.crt
      - ./nginx-proxy/ssl/nginx.key:/etc/ssl/private/nginx.key
    # ports:
    #   - "80:80"
    #   - "443:443"
    depends_on:
      - frontend_client
      - backend_api
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_tunnel
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: "eyJhIjoiM2Q0MGRmMjc3ZDkxOGM3NmMyMTU1ZWZmNzM3NmM5ZjEiLCJ0IjoiNTRiYmY1OWEtNDhkMC00MjdiLWE0ODctYmY2NzBmNDMyMWRjIiwicyI6IlpUVmhPV1kzTlRZdFlUYzRPUzAwTTJJekxXSTJaVGd0TkRCbE9HUTROV1ptT0RCaCJ9" 
    command: tunnel --no-autoupdate run
    depends_on:
      - nginx_proxy

volumes:
  db_data:
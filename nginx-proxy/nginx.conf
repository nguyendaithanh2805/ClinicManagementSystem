upstream backend_api_upstream {
    server backend_api:8080;
}

upstream ai_service_upstream {
    server ai_service:5000;
}

upstream frontend_client_upstream {
    server frontend_client:80;
}

server {
    listen 80;
    listen 443 ssl;
    server_name phongkhamdakhoa-ndt.site www.phongkhamdakhoa-ndt.site;

    # Cấu hình headers tiêu chuẩn
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Cấu hình SSL/TLS giả định để Nginx khởi động ở chế độ SSL
    ssl_certificate /etc/ssl/certs/nginx.crt;
    ssl_certificate_key /etc/ssl/private/nginx.key;

    # 1. Định tuyến cho Frontend (React/Nginx nội bộ)
    location / {
        proxy_pass http://frontend_client_upstream;
    }

    # 2. Định tuyến cho API Backend (.NET)
    location /api/ {
        proxy_pass http://backend_api_upstream;
    }

    # 3. Định tuyến cho AI Service (Python/Flask)
    location /ai/ {
        proxy_pass http://ai_service_upstream;
    }
}
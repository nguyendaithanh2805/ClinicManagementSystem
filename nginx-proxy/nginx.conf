# Định nghĩa các upstream
upstream backend_api {
    server backend_api:8080;
}

upstream ai_service {
    server ai_service:5000;
}

upstream frontend_client {
    server frontend_client:80;
}

server {
    listen 80;
    listen 443 ssl;
    server_name phongkhamdakhoa-ndt.site www.phongkhamdakhoa-ndt.site;

    # Cấu hình SSL/TLS
    ssl_certificate /etc/ssl/certs/nginx.crt;
    ssl_certificate_key /etc/ssl/private/nginx.key;

    # Cấu hình headers tiêu chuẩn cho proxy
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Định tuyến Frontend
    location / {
        proxy_pass http://frontend_client;
    }

    # Định tuyến Backend API
    location /api/ {
        proxy_pass http://backend_api;
    }

    # SignalR/ChatHub (cần nâng cấp WebSocket)
    location /api/chatHub {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://backend_api;
    }

    # Định tuyến AI Service
    location /ai/ {
        proxy_pass http://ai_service/;
    }
}
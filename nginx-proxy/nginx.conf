# --- Server 1: Chuyển hướng HTTP (Port 80) sang HTTPS ---
server {
    listen 80;
    server_name phongkhamdakhoa-ndt.site www.phongkhamdakhoa-ndt.site;

    # Cấu hình này là bắt buộc cho Certbot xác minh domain
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Chuyển hướng tất cả các yêu cầu HTTP khác sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Server 2: Phục vụ HTTPS (Port 443) ---
server {
    listen 443 ssl;
    server_name phongkhamdakhoa-ndt.site www.phongkhamdakhoa-ndt.site;

    # Đường dẫn tới chứng chỉ SSL (sẽ được Certbot tạo ra và mount vào container)
    ssl_certificate /etc/letsencrypt/live/phongkhamdakhoa-ndt.site/fullchain.pem;
    ssl_key /etc/letsencrypt/live/phongkhamdakhoa-ndt.site/privkey.pem;
    
    # Cấu hình bảo mật SSL tiêu chuẩn (Có thể bỏ qua, nhưng nên có)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    # ... (các cài đặt bảo mật khác)

    # 1. Định tuyến cho Frontend (React/Nginx nội bộ)
    location / {
        proxy_pass http://frontend_client:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 2. Định tuyến cho API Backend (.NET)
    location /api/ {
        proxy_pass http://backend_api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. Định tuyến cho AI Service (Python/Flask)
    location /ai/ {
        proxy_pass http://ai_service:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}